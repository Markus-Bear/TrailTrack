spring.application.name=trailtrack-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/trailtrack
spring.datasource.username=markus
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

trailtrack.import.trail-routes-url=https://services-eu1.arcgis.com/CltcWyRoZmdwaB7T/ArcGIS/rest/services/GetIrelandActiveTrailRoutes/FeatureServer/0/query
trailtrack.import.trailheads-url=https://services-eu1.arcgis.com/CltcWyRoZmdwaB7T/ArcGIS/rest/services/GetIrelandActiveTrailHeads/FeatureServer/0/query
